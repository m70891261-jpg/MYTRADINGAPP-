<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <title>AI Trading Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }
    .header {
      text-align: center;
      padding: 20px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 24px;
      background: linear-gradient(90deg, #00aaff, #00ffaa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header .status {
      font-size: 12px;
      color: #00ffaa;
      margin-top: 5px;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      backdrop-filter: blur(10px);
    }
    .card h2 {
      font-size: 14px;
      color: #888;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .balance {
      font-size: 36px;
      font-weight: bold;
      background: linear-gradient(90deg, #00aaff, #00ffaa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      transition: transform 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-buy {
      background: linear-gradient(90deg, #00c853, #00e676);
      color: #000;
    }
    .btn-sell {
      background: linear-gradient(90deg, #ff1744, #ff5252);
      color: #fff;
    }
    .row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .row:last-child { border-bottom: none; }
    .row .label { color: #888; }
    .row .value { font-weight: bold; }
    .green { color: #00ffaa; }
    .red { color: #ff5252; }
    #updateBtn {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      padding: 14px;
      background: #00aaff;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>AI Trading Agent</h1>
    <div class="status">● Live • App Running</div>
  </div>

  <div class="card">
    <h2>Portfolio Balance</h2>
    <div class="balance">$10,000.00</div>
    <div class="row" style="margin-top:10px;">
      <span class="label">Today's P&L</span>
      <span class="value green">+$245.50 (2.45%)</span>
    </div>
  </div>

  <div class="card">
    <h2>Market Watch</h2>
    <div class="row">
      <span class="label">BTC/USD</span>
      <span class="value green">$67,234 ▲ 1.2%</span>
    </div>
    <div class="row">
      <span class="label">ETH/USD</span>
      <span class="value red">$3,456 ▼ 0.8%</span>
    </div>
    <div class="row">
      <span class="label">SOL/USD</span>
      <span class="value green">$178 ▲ 3.5%</span>
    </div>
  </div>

  <div class="card">
    <h2>Quick Actions</h2>
    <button class="btn btn-buy" onclick="trade('BUY')">Buy</button>
    <button class="btn btn-sell" onclick="trade('SELL')">Sell</button>
  </div>

  <div class="card">
    <h2>AI Signal</h2>
    <div class="row">
      <span class="label">Recommendation</span>
      <span class="value green">STRONG BUY</span>
    </div>
    <div class="row">
      <span class="label">Confidence</span>
      <span class="value">87%</span>
    </div>
    <div class="row">
      <span class="label">Timeframe</span>
      <span class="value">4H</span>
    </div>
  </div>

  <button id="updateBtn">🔄 New version available — Tap to update</button>

  <script src="app.js"></script>
</body>
</html>
