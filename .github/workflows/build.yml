name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Init Bubblewrap
        run: |
          mkdir -p build && cd build
          bubblewrap init --manifest https://your-username.github.io/AITradeApp/manifest.json --directory .

      - name: Build APK
        run: cd build && bubblewrap build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-trade-apk
          path: build/*.apk
