name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Init Bubblewrap
        run: |
          mkdir -p build && cd build
          printf "\n\n\n\n\n\n\n\n\n\n" | bubblewrap init --manifest https://m70891261-jpg.github.io/MYTRADINGAPP-/manifest.json --directory . || true

      - name: Create signing key
        run: |
          cd build
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=AITrade, OU=Dev, O=AITrade, L=Delhi, S=Delhi, C=IN"

      - name: Build APK
        run: |
          cd build
          bubblewrap build \
            --skipPwaValidation \
            --keystore android.keystore \
            --keystorePassword android \
            --keyPassword android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-trade-apk
          path: build/*.apk
